name: Boogie Differential Oracle

on:
  workflow_dispatch:
    inputs:
      arinc_version:
        description: ArincVersion enum passed to BoogieDump
        required: true
        default: V19
        type: choice
        options:
          - V18
          - V19
          - V20
          - V21
          - V22
      cifp_url:
        description: Optional HTTP(S) URL to a .cifp or .gz archive to compare
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Boogie JARs and compiled oracle
        uses: actions/cache@v4
        with:
          path: .cache/boogie-oracle
          key: boogie-oracle-${{ hashFiles('tests/oracle/deps.json', 'tests/oracle/BoogieDump.java') }}

      - name: Run unit and static invariant tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run Boogie differential smoke check
        run: PYTHONPATH=src python -m tests.oracle.run --smoke --version "${{ inputs.arinc_version }}" --check-to-db

      - name: Run Boogie differential check on external CIFP URL
        if: inputs.cifp_url != ''
        env:
          CIFP_URL: ${{ inputs.cifp_url }}
          ARINC_VERSION: ${{ inputs.arinc_version }}
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request
          url = os.environ["CIFP_URL"]
          ext = ".gz" if url.endswith(".gz") else ".cifp"
          dest = pathlib.Path(f".cache/external_cifp{ext}")
          dest.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(url, dest)
          PY
          ext=$(case "${{ inputs.cifp_url }}" in *.gz) echo ".gz" ;; *) echo ".cifp" ;; esac)
          PYTHONPATH=src python -m tests.oracle.run --cifp ".cache/external_cifp${ext}" --version "${{ inputs.arinc_version }}" --check-to-db
